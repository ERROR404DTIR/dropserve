<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">dropserve</title><desc id="desc">A minimal animated LAN file sharing banner.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111a2c"/><stop offset="1" stop-color="#172b40"/></linearGradient><linearGradient id="a"><stop stop-color="#55d6be"/><stop offset="1" stop-color="#6387ff"/></linearGradient></defs><rect width="1200" height="320" rx="28" fill="url(#bg)"/><g transform="translate(90 83)"><rect width="112" height="112" rx="28" fill="url(#a)"/><path d="M56 27v48m-19-19 19 19 19-19" fill="none" stroke="#08121f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 83v8q0 9 9 9h34q9 0 9-9v-8" fill="none" stroke="#08121f" stroke-width="8" stroke-linecap="round"/></g><text x="245" y="137" fill="#f0f5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="750">dropserve</text><text x="249" y="184" fill="#a8bad2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">Your files. Your network. Your token.</text><g transform="translate(865 90)" fill="none" stroke="#55d6be" stroke-width="3"><rect x="0" y="0" width="220" height="130" rx="16" stroke-opacity=".45"/><path d="M25 65h170" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="2s" repeatCount="indefinite"/></path><circle cx="110" cy="65" r="27" fill="#55d6be" fill-opacity=".12"/><path d="M110 47v36m-13-13 13 13 13-13" stroke-linecap="round" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 -4;0 4;0 -4" dur="1.6s" repeatCount="indefinite"/></path></g><text x="900" y="265" fill="#7187a5" font-family="monospace" font-size="17">BROWSE · UPLOAD · DOWNLOAD</text></svg>