<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Dropserve</title><desc id="d">Files move between devices over a local network.</desc><defs><linearGradient id="bg"><stop stop-color="#152c3b"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="#142f43" stroke="#62e3c1" stroke-width="3"><rect x="120" y="88" width="190" height="125" rx="14"/><rect x="890" y="88" width="190" height="125" rx="14"/></g><g fill="#edf3ff" font-family="monospace" font-size="15" text-anchor="middle"><text x="215" y="145">DEVICE A</text><text x="215" y="177">SHARE</text><text x="985" y="145">DEVICE B</text><text x="985" y="177">RECEIVE</text></g><path d="M310 150H890" stroke="#8fa8ff" stroke-width="4" stroke-dasharray="12 12"><animate attributeName="stroke-dashoffset" values="0;-96" dur="2.5s" repeatCount="indefinite"/></path><g fill="#62e3c1"><rect x="540" y="128" width="42" height="42" rx="6"><animate attributeName="y" values="128;115;128" dur="2s" repeatCount="indefinite"/></rect><path d="M560 135V160M550 150L560 160L570 150" stroke="#09201d" stroke-width="3" fill="none"/></g><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">DROPSERVE</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">LOCAL NETWORK / FILE TRANSFER</text></svg>